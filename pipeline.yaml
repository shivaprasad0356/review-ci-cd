AWSTemplateFormatVersion: '2010-09-09'
Description: End-to-End Professional CI/CD for S3

Resources:
  # S3 Bucket Configured for Website Hosting
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "release-app-${AWS::StackName}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html

  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${AppBucket}/*"

  # IAM Roles (Automatically handles permissions)
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
      Policies:
        - PolicyName: PipelinePolicy
          PolicyDocument:
            Statement:
              - Action: ["s3:*", "codebuild:*", "codecommit:*"]
                Effect: Allow
                Resource: "*"

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
      Policies:
        - PolicyName: BuildPolicy
          PolicyDocument:
            Statement:
              - Action: ["logs:*", "s3:*"]
                Effect: Allow
                Resource: "*"

  # CodeBuild & Pipeline
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-Builder"
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: {Type: CODEPIPELINE}
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      Source: {Type: CODEPIPELINE}

  AppRepo:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-Repo"

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: ReleasePipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref AppBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId: {Category: Source, Owner: AWS, Provider: CodeCommit, Version: '1'}
              Configuration:
                RepositoryName: !GetAtt AppRepo.Name
                BranchName: main
                PollForSourceChanges: false # Triggered only by Release Change
              OutputArtifacts: [{Name: SourceOut}]
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId: {Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1'}
              Configuration: {ProjectName: !Ref BuildProject}
              InputArtifacts: [{Name: SourceOut}]
              OutputArtifacts: [{Name: BuildOut}]
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId: {Category: Deploy, Owner: AWS, Provider: S3, Version: '1'}
              Configuration:
                BucketName: !Ref AppBucket
                Extract: true
              InputArtifacts: [{Name: BuildOut}]
