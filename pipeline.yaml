AWSTemplateFormatVersion: '2010-09-09'
Description: End-to-End Automated CI/CD - GitHub to S3

Parameters:
  GitHubRepo:
    Type: String
  ConnectionArn:
    Type: String

Resources:
  # S3 Bucket for Hosting
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "release-app-${AWS::StackName}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html

  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${AppBucket}/*"

  # IAM Roles
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
      Policies:
        - PolicyName: PipelinePolicy
          PolicyDocument:
            Statement:
              - Action: ["s3:*", "codebuild:*", "codestar-connections:UseConnection"]
                Effect: Allow
                Resource: "*"

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
      Policies:
        - PolicyName: BuildPolicy
          PolicyDocument:
            Statement:
              - Action: ["logs:*", "s3:*"]
                Effect: Allow
                Resource: "*"

  # CodeBuild Project
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-Builder"
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: {Type: CODEPIPELINE}
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
      Source: {Type: CODEPIPELINE}

  # The Pipeline
  AppPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: ReleasePipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref AppBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub_Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: main
                DetectChanges: false
              OutputArtifacts: [{Name: SourceOut}]
        - Name: Build
          Actions:
            - Name: Build_Action
              ActionTypeId: {Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1'}
              Configuration: {ProjectName: !Ref BuildProject}
              InputArtifacts: [{Name: SourceOut}]
              OutputArtifacts: [{Name: BuildOut}]
        - Name: Deploy
          Actions:
            - Name: S3_Deploy
              ActionTypeId: {Category: Deploy, Owner: AWS, Provider: S3, Version: '1'}
              Configuration:
                BucketName: !Ref AppBucket
                Extract: true
              InputArtifacts: [{Name: BuildOut}]
