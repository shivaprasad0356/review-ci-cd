AWSTemplateFormatVersion: '2010-09-09'
Resources:
  # S3 Bucket for Production Deployment
  ProdAppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-release-bucket"
      WebsiteConfiguration:
        IndexDocument: index.html

  # CodePipeline Configuration
  ProfessionalPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      ExecutionMode: QUEUED 
      RoleArn: !GetAtt PipelineRole.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: MyRepo
                BranchName: main
                PollForSourceChanges: false # CRITICAL: Disables auto-trigger on push
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build_and_Test
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Deploy_Release
          Actions:
            - Name: S3Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                BucketName: !Ref ProdAppBucket
                Extract: true
              InputArtifacts:
                - Name: BuildOutput
